software:
  - name: ECCentric
    link: https://eccentric-benchmark.github.io/
    code: https://github.com/TUM-DSE/eccentric
    description: >-
      A modular, extensible, end-to-end benchmarking framework for quantum error correction codes.
      ECCentric spans the full stack, from code construction and compilation to simulated execution
      on devices with given topologies and noise characteristics, enabling an empirical comparison
      of major QEC code families across decoders, noise models, and hardware platforms.

