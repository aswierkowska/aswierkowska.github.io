research_interests: >-
  My research drives the development of practical quantum systems, with a core focus on
  fault-tolerant quantum computing. I aim to bridge the gap between theoretical Quantum Error
  Correction (QEC) and physical quantum hardware through rigorous hardware-software co-design,
  developing scalable compilation frameworks and robust controller stacks.

