<header>
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-first">{{ site.first_name }}</span> <span class="brand-last">{{ site.last_name }}</span>
      </a>
      <ul class="navbar-nav">
        {% for item in site.nav %}
        <li class="nav-item{% if page.nav_active == item.title %} active{% endif %}">
          <a class="nav-link" href="{{ item.url }}">{{ item.title }}{% if page.nav_active == item.title %}<span class="sr-only"></span>{% endif %}</a>
        </li>
        {% endfor %}
        <li class="nav-item">
          <button id="theme-toggle" type="button" title="Switch between light and dark theme" aria-label="Switch colour theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </nav>
  <div id="progress"></div>
</header>
